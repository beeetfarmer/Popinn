version: 2

# Dependabot opens its pull requests against dev, not main.
#
# main is only reached by promoting dev through a reviewed pull request, and a
# PR straight into main would sidestep that entirely -- it would be merged
# without ever having run the dev gate, and would leave main ahead of dev so the
# next promotion merges onto a diverged base.
#
# Trade-off worth knowing: setting target-branch turns off Dependabot's
# automatic *security* update PRs for that ecosystem. Security *alerts* still
# appear under Security -> Dependabot, so nothing is hidden; you just apply the
# fix yourself instead of being handed a branch. Given the security PRs raised
# here have consistently offered upgrades that did not clear the advisory they
# cited, that is an acceptable exchange.
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and without this
    # Dependabot would offer it the moment it appears.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Majors are excluded from the group entirely, because grouping and major
      # bumps work against each other here. One shared lockfile means one PR,
      # and a single package that cannot resolve or cannot build fails all of
      # it: TypeScript 7 blocked 58 fine updates on a typescript-eslint peer
      # range, and the next batch arrived carrying React 19, React Router 7,
      # Tailwind 4 and Vite 8 at once -- four framework migrations, of which
      # Tailwind 4 alone broke `npm run build` by moving its PostCSS plugin to
      # a separate package. That PR also proposed React Router 7.18, which sits
      # inside GHSA-qwww-vcr4-c8h2 (fixed in 8.3.0), so taking it would have
      # moved us off an unaffected v6 and into the advisory.
      #
      # So majors are done deliberately, one at a time, with the gate green in
      # between; this keeps the weekly PR to minor and patch, which is what
      # grouping is actually good at. The cost is that a major no longer shows
      # up as a PR -- check for them by hand now and then. Security alerts are
      # unaffected and still appear under Security -> Dependabot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per ecosystem rather than one per package: the lockfile is
      # shared, so separate PRs conflict with each other on sight.
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and without this
    # Dependabot would offer it the moment it appears.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and without this
    # Dependabot would offer it the moment it appears.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and without this
    # Dependabot would offer it the moment it appears.
    cooldown:
      default-days: 7
    ignore:
      # Python 3.14 is held back because psycopg2-binary publishes no wheel for
      # it, so pip falls back to building from source and the backend image
      # fails with "pg_config executable not found". Revisit when psycopg2-binary
      # ships 3.14 wheels, or if the driver moves to psycopg 3.
      - dependency-name: "python"
        versions: ["3.14"]
