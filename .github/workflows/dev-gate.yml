name: Dev Gate

# Push to dev -> full vulnerability suite -> merge into main.
# The merge uses MAIN_PUSH_TOKEN (a PAT) rather than the default GITHUB_TOKEN,
# because GitHub deliberately does not trigger workflows from pushes made with
# GITHUB_TOKEN -- with it, main-release.yml would never run.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Deliberately a job-level filter rather than `on.push.paths-ignore`.
          # A trigger-level filter would skip the whole workflow, and the merge
          # into main lives in this workflow -- so a docs-only push would never
          # reach main at all. This way the scans skip and the merge still runs.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: scanning."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No usable base (first push of a branch, or a force-push that
          # orphaned it) means we cannot diff, so assume code and scan.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit: scanning."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"
          # Docs-only iff EVERY changed path is documentation. A commit that
          # touches a README and a Dockerfile still scans, which is the point:
          # the filter can only ever skip changes that cannot affect an image.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "Code changed: scanning."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: skipping scans, still merging."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security Gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/security-audit.yml

  merge-to-main:
    name: Merge to main
    needs: [changes, security]
    # `security` is skipped for docs-only pushes, and a skipped dependency would
    # normally skip this job too. Accept success-or-skipped, but never a failure
    # and never a broken `changes` job -- otherwise a failed scan would still
    # merge, which is the one thing this gate exists to prevent.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.security.result == 'success' || needs.security.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAIN_PUSH_TOKEN }}
          persist-credentials: true

      - name: Verify push token is configured
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
        run: |
          if [ -z "$MAIN_PUSH_TOKEN" ]; then
            echo "::error::MAIN_PUSH_TOKEN secret is not set. Create a fine-grained PAT with"
            echo "::error::Contents: read/write on this repository and add it as a repo secret."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          set -euo pipefail
          git checkout main
          git merge --no-edit "${GITHUB_SHA}"
          git push origin main
