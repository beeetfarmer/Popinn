name: Dev Gate

# Push to dev -> full vulnerability suite. That is all.
#
# Promotion to main is deliberately manual: open a pull request from dev to
# main, let the gate run on it, and merge. Merging is an ordinary push to main,
# which triggers main-release.yml to re-run the gate against the merged tree and
# publish.
#
# This used to auto-merge into main, which meant main advanced on every commit
# and could hold a half-finished change. It also required MAIN_PUSH_TOKEN -- a
# PAT with contents write -- because GitHub does not trigger workflows from
# pushes made with the default GITHUB_TOKEN. Merging a PR yourself needs no such
# token, so that secret can be deleted.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: scanning."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No usable base (first push of a branch, or a force-push that
          # orphaned it) means we cannot diff, so assume code and scan.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit: scanning."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"
          # Docs-only iff EVERY changed path is documentation. A commit that
          # touches a README and a Dockerfile still scans, which is the point:
          # the filter can only ever skip changes that cannot affect an image.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "Code changed: scanning."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: skipping scans."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security Gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/security-audit.yml
