name: Security Audit

# The single definition of "is this tree safe to ship". Called as a reusable
# workflow by both dev-gate.yml (before merging to main) and main-release.yml
# (before publishing images), so the two gates can never drift apart.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:

permissions:
  contents: read

jobs:
  secrets-gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source /repo \
            --redact \
            --exit-code 1

  sast-semgrep:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            returntocorp/semgrep:latest semgrep scan \
            --config p/owasp-top-ten \
            --exclude-rule python.lang.security.audit.md5-used-as-password.md5-used-as-password \
            --exclude-rule python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5 \
            --error

  iac-checkov:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov

      - name: Scan Compose Files
        run: checkov -f docker-compose.dev.yml -f docker-compose.prod.yml

      - name: Scan Dockerfiles
        run: checkov -f backend/Dockerfile -f frontend/Dockerfile

  backend-dependencies:
    name: Backend CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Scan backend requirements
        run: pip-audit -r backend/requirements.txt --strict

  frontend-dependencies:
    name: Frontend CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Scan production dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # vite build uses SWC, which strips types without checking them, so the
      # typecheck has to be its own step.
      - name: Typecheck
        run: npx --prefix frontend tsc --noEmit --project frontend/tsconfig.json

      - name: Run tests
        run: npm test --prefix frontend

  container-images:
    name: Container CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t popinn-backend:scan .

      - name: Build web image
        run: docker build -f frontend/Dockerfile --target prod -t popinn-web:scan .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: popinn-backend:scan
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: popinn-web:scan
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: popinn-sbom.cdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: popinn-sbom
          path: popinn-sbom.cdx.json
