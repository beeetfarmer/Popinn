name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-dependencies:
    name: Backend CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Scan backend requirements
        run: pip-audit -r backend/requirements.txt --strict

  frontend-dependencies:
    name: Frontend CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Scan production dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high

  container-images:
    name: Container CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t popinn-backend:scan .

      - name: Build web image
        run: docker build -f frontend/Dockerfile --target prod -t popinn-web:scan .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: popinn-backend:scan
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: popinn-web:scan
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
