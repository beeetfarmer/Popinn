name: Main Release

# Push to main (including the auto-merge from dev-gate.yml) -> full
# vulnerability suite re-run against the merged tree -> publish images.
# Nothing reaches Docker Hub unless every scan job passes.
#
# Two kinds of push land here:
#   main         -> :latest and :<sha>, the rolling build
#   tag v0.1.0   -> :0.1.0, :0.1 and :latest, a versioned release
# The git tag is the source of truth for the version; nothing is read from a
# file, so a release is exactly `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  security:
    name: Security Gate
    uses: ./.github/workflows/security-audit.yml

  publish:
    name: Publish to Docker Hub
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be set."
            exit 1
          fi

      - name: Compute image tags
        id: meta
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Every build is addressable by commit; the rest depends on the ref.
          names="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              # Full release. The MAJOR.MINOR alias tracks the newest patch, so
              # 0.1 follows 0.1.0 -> 0.1.1 without anyone editing a compose file.
              names="$names $version ${version%.*} latest"
            elif printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
              # Pre-release: publishable, but it must never capture :latest or
              # the alias, or `docker pull popinn-web` starts serving an rc.
              names="$names $version"
            else
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
          else
            names="$names latest"
          fi
          echo "Publishing tags: $names"
          for image in backend web; do
            {
              echo "${image}<<TAGS_EOF"
              for n in $names; do
                echo "${REGISTRY_USER}/popinn-${image}:${n}"
              done
              echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
