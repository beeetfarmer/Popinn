name: Main Release

# Push to main -> full vulnerability suite re-run against the merged tree ->
# publish images. Nothing reaches Docker Hub unless every scan job passes.
#
# Two kinds of push land here:
#   main         -> :edge and :<sha>, the rolling build
#   tag v0.1.0   -> :0.1.0, :0.1 and :latest, a versioned release
#
# The rolling channel is :edge, not :latest. main is reached by merging a
# promotion pull request from dev, which can carry several commits and is not
# necessarily tagged, so a push to main is not the same thing as a release.
# Naming that :latest would quietly break the one thing everyone assumes about
# it, and the failure is silent: you pull an untagged build and cannot tell why.
#
# The git tag is the source of truth for the version; nothing is read from a
# file, so a release is exactly `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A job-level filter, not `on.push.paths-ignore`, because a trigger
          # filter would also be applied to tag pushes -- where "changed files"
          # is not meaningful -- and could silently skip a release.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag push: always a release, never filtered."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: publishing."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit: publishing."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "Code changed: rebuilding and publishing."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            # Nothing that lands in an image changed, so :latest already points
            # at this tree's build. Rebuilding would only churn the digest.
            echo "Documentation only: skipping rebuild and publish."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security Gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/security-audit.yml

  publish:
    name: Publish to Docker Hub
    needs: [changes, security]
    if: needs.changes.outputs.code == 'true' && needs.security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be set."
            exit 1
          fi

      - name: Compute image tags
        id: meta
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Every build is addressable by commit; the rest depends on the ref.
          names="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              # Full release. The MAJOR.MINOR alias tracks the newest patch, so
              # 0.1 follows 0.1.0 -> 0.1.1 without anyone editing a compose file.
              names="$names $version ${version%.*} latest"
            elif printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
              # Pre-release: publishable, but it must never capture :latest or
              # the alias, or `docker pull popinn-web` starts serving an rc.
              names="$names $version"
            else
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
          else
            # Rolling channel. Deliberately not :latest -- see the header.
            names="$names edge"
          fi
          echo "Publishing tags: $names"
          for image in backend web; do
            {
              echo "${image}<<TAGS_EOF"
              for n in $names; do
                echo "${REGISTRY_USER}/popinn-${image}:${n}"
              done
              echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
