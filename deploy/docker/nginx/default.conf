server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Written by /docker-entrypoint.d/05-resolver.sh. Combined with the variable
  # upstream below, this makes nginx resolve the backend per request instead of
  # refusing to start when the backend is not yet up.
  include /tmp/popinn-resolver.conf;
  set $popinn_backend "backend:8471";

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Origin-Agent-Cluster "?1" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    limit_except GET HEAD OPTIONS { deny all; }
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    add_header Cache-Control "no-store" always;
    limit_except GET HEAD POST PUT PATCH DELETE OPTIONS { deny all; }
    proxy_pass http://$popinn_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /media/ {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://$popinn_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /data/ {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://$popinn_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
