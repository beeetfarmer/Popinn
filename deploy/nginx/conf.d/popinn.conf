server {
  listen 8080;
  server_name _;

  root /home/neil/Documents/Projects/Web/Popinn/frontend/dist;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;

    proxy_pass http://127.0.0.1:8471/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /media/ {
    alias /home/neil/Documents/Projects/Web/Popinn/test-media/;

    add_header Cache-Control "public, max-age=3600";
    add_header Accept-Ranges bytes always;
    expires 1h;

    # Required for smooth video seek support.
    mp4;
    mp4_buffer_size 4m;
    mp4_max_buffer_size 32m;

    try_files $uri =404;
  }
}
