name: Release

# main            -> :edge and :<sha>                       rolling build, deliberately not :latest
# tag vX.Y.Z      -> :X.Y.Z, :X.Y, :latest and :<sha>        versioned release; an existing X.Y.Z is never overwritten
# tag vX.Y.Z-rc.1 -> :X.Y.Z-rc.1 and :<sha>                  pre-release, never captures :latest or :X.Y
# Every check from dev.yml runs again first; the images are pushed only if all of them pass.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CHECKOUT_TOKEN: ${{ github.token }}

jobs:
  backend:
    name: Backend CVE and IaC scans
    runs-on: docker
    container:
      image: docker.io/library/python:3.13-trixie    # same Python and Debian release as backend/Dockerfile
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install tools
        run: pip install -q --root-user-action=ignore pip-audit checkov
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt --strict
      - name: Scan compose files and Dockerfiles
        run: checkov --quiet -f docker-compose.dev.yml -f docker-compose.prod.yml -f backend/Dockerfile -f frontend/Dockerfile

  frontend:
    name: Frontend types, tests, audit
    runs-on: docker
    container:
      image: docker.io/library/node:26-trixie
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install
        run: npm ci --no-fund --prefix frontend
      # vite build uses SWC, which strips types without checking them, so the typecheck has to be its own step.
      - name: Typecheck
        run: npx --prefix frontend tsc --noEmit --project frontend/tsconfig.json
      - name: Tests
        run: npm test --prefix frontend
      - name: Dependency audit
        run: npm audit --prefix frontend --omit=dev --audit-level=high

  sast:
    name: Semgrep
    runs-on: docker
    container:
      image: docker.io/semgrep/semgrep:1.178.0
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Scan
        run: >
          semgrep scan --metrics off --error --config p/owasp-top-ten
          --exclude-rule python.lang.security.audit.md5-used-as-password.md5-used-as-password
          --exclude-rule python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5

  secrets:
    name: Gitleaks
    runs-on: docker
    container:
      image: docker.io/zricethezav/gitleaks:v8.30.1
    steps:
      - name: Checkout full history
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Scan history
        run: gitleaks git . --redact --exit-code 1

  publish:
    name: Build, scan and publish images
    needs: [backend, frontend, sast, secrets]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    container:
      image: docker.io/library/docker:28-cli
    env:
      IMAGE_PREFIX: docker.io/beeetfarmer/popinn
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Check configuration
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] || { echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"; exit 1; }
      - name: Work out tags
        run: |
          tags="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              tags="$tags $version ${version%.*} latest"
            elif echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
              tags="$tags $version"
            else
              echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
            fi
          else
            version="edge-$(echo "$GITHUB_SHA" | cut -c1-12)"
            tags="$tags edge"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "Publishing $IMAGE_PREFIX-backend and $IMAGE_PREFIX-web with tags: $tags"
      - name: Build
        run: |
          for target in "backend backend/Dockerfile runtime" "web frontend/Dockerfile prod"; do
            set -- $target
            docker build --pull --load -f "$2" --target "$3" \
              --label org.opencontainers.image.version="$VERSION" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -t "popinn-$1:release-$GITHUB_RUN_NUMBER" .
          done
      - name: Scan images (fail on fixable HIGH or CRITICAL)
        run: |
          for image in backend web; do
            docker save "popinn-$image:release-$GITHUB_RUN_NUMBER" | docker run --rm -i --entrypoint sh docker.io/aquasec/trivy:0.74.0 \
              -c 'cat > /tmp/image.tar && trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --input /tmp/image.tar'
          done
      - name: Software bill of materials
        run: |
          for image in backend web; do
            docker save "popinn-$image:release-$GITHUB_RUN_NUMBER" | docker run --rm -i --entrypoint sh docker.io/aquasec/trivy:0.74.0 \
              -c 'cat > /tmp/image.tar && trivy image --quiet --format cyclonedx --input /tmp/image.tar'
          done
      - name: Sign in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
      - name: Refuse to overwrite a released version
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || exit 0
          for image in backend web; do
            if docker buildx imagetools inspect "$IMAGE_PREFIX-$image:$VERSION" >/dev/null 2>&1; then
              echo "$IMAGE_PREFIX-$image:$VERSION already exists. Release a new version instead."; exit 1
            fi
          done
      - name: Push the scanned images
        run: |
          for image in backend web; do
            for t in $TAGS; do
              docker tag "popinn-$image:release-$GITHUB_RUN_NUMBER" "$IMAGE_PREFIX-$image:$t"
              docker push -q "$IMAGE_PREFIX-$image:$t"
            done
          done
      - name: Sign out and clean up
        if: always()
        run: |
          docker logout docker.io || true
          for image in backend web; do
            docker image rm -f "popinn-$image:release-$GITHUB_RUN_NUMBER" $(for t in $TAGS; do echo "$IMAGE_PREFIX-$image:$t"; done) 2>/dev/null || true
          done
