name: popinn-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-popinn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    pids_limit: 512
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-popinn} -d ${POSTGRES_DB:-popinn}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: beeetfarmer/popinn-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${POPINN_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-popinn}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-popinn}
      PYTHONPATH: /app/backend
      MEDIA_PATH: /media
      APP_DATA_PATH: /app-data
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      STREAM_TOKENIZATION_ENABLED: ${STREAM_TOKENIZATION_ENABLED:-true}
      STREAM_TOKEN_REQUIRED: ${STREAM_TOKEN_REQUIRED:-false}
      STREAM_TOKEN_TTL_SECONDS: ${STREAM_TOKEN_TTL_SECONDS:-21600}
    command: >
      sh -lc "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8471"
    working_dir: /app/backend
    # The image runs as UID 10001. Whether that UID can write to the APPDATA
    # bind mount depends on your container runtime, so it is configurable:
    #
    #   Rootless podman (the default here):
    #     POPINN_USERNS=keep-id:uid=10001,gid=10001
    #     Rootless podman maps container UID 10001 to an unprivileged subuid
    #     that cannot write to host directories, so every thumbnail, preview
    #     and artist-image write fails with EACCES. keep-id remaps it to your
    #     host user, which keeps the container non-root AND writable.
    #
    #   Docker (rootful, the usual Docker Engine install):
    #     POPINN_USERNS=
    #     Leave it empty -- Docker does not understand keep-id and will refuse
    #     to start. Instead give the host directory to the image's user once:
    #       mkdir -p ./app-data-dev && sudo chown -R 10001:10001 ./app-data-dev
    #
    #   Rootless Docker: same as rootful Docker (leave empty), but chown to the
    #   subuid that maps to 10001 inside your user namespace.
    userns_mode: ${POPINN_USERNS:-keep-id:uid=10001,gid=10001}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    pids_limit: 256
    # Both of these scale with BACKGROUND_WORKERS, because each worker can hold
    # an ffmpeg transcode. Measured with 4 workers transcoding concurrently:
    # ~2.1GB resident, and 1.5 CPUs pegged at 100% (one HLS job finished in the
    # time four should have). Budget roughly 0.5g and 1 CPU per worker.
    mem_limit: ${POPINN_BACKEND_MEMORY:-4g}
    cpus: "${POPINN_BACKEND_CPUS:-4}"
    volumes:
      - ${POPINN_MEDIA_PATH:-./media}:/media:ro
      - ${POPINN_APPDATA_PATH:-./app-data-dev}:/app-data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8471/api/v1/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

  web:
    image: beeetfarmer/popinn-web:${TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/cache/nginx:size=64m,noexec,nosuid,nodev
      - /var/run:size=8m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
